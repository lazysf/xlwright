# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    # Preserve the imported reference document without automatic formatting.
    { id = "trailing-whitespace", exclude = '^references/PROJECT_OVERVIEW_V22\.md$' },
    { id = "end-of-file-fixer", exclude = '^references/PROJECT_OVERVIEW_V22\.md$' },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    # Uses the markdownlint-cli2 installed by `npm ci` with the Node.js version in .nvmrc.
    { id = "markdownlint", name = "markdownlint", entry = "npx --no-install markdownlint-cli2", language = "system", types = ["markdown"] },
    # Commits of anything but Markdown carry a passed integrated check. Excluding keeps new build inputs covered.
    # prek does not pass deleted files to hooks, so a commit that only deletes code skips this.
    { id = "integrated-check", name = "npm run check", entry = "npm run check", language = "system", pass_filenames = false, exclude = '\.md$' },
]
