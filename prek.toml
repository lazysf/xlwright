# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    # Preserve the imported reference document without automatic formatting.
    { id = "trailing-whitespace", exclude = '^references/PROJECT_OVERVIEW_V22\.md$' },
    { id = "end-of-file-fixer", exclude = '^references/PROJECT_OVERVIEW_V22\.md$' },
    { id = "check-added-large-files" },
]
